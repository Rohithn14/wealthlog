[project]
name = "wealthlog"
version = "0.1.0"
description = "Local-first personal finance & investment tracker (INR-first, Indian + US assets) with CLI, TUI, and web/desktop UI."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Rohithn14", email = "rohithnamavaram1@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["finance", "investment", "portfolio", "xirr", "expenses", "networth", "india"]
dependencies = [
    "alembic>=1.18.4",
    "fpdf2>=2.8.7",
    "httpx>=0.28.1",
    "nicegui>=3.12.1",
    "openpyxl>=3.1.5",
    "platformdirs>=4.10.0",
    "pyxirr>=0.10.8",
    "rich>=15.0.0",
    "sqlmodel>=0.0.38",
    "textual>=8.2.7",
    "typer>=0.12",
    "yfinance>=1.4.1",
]

[project.scripts]
wealthlog = "wealthlog.api.server:main"
wealthlog-tui = "wealthlog.tui.app:main"
wealthlog-cli = "wealthlog.cli.main:app"
wealthlog-alerts = "wealthlog.alerts.watcher:main"
wealthlog-sidecar = "wealthlog.sidecar.app:main"

[project.urls]
Homepage = "https://github.com/Rohithn14/wealthlog"
Repository = "https://github.com/Rohithn14/wealthlog"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["wealthlog.services", "wealthlog.finance"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
